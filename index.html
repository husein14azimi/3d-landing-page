<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
  />
  <title>Exhibition Road</title>
  <!-- Blank data-URI icon avoids an unnecessary /favicon.ico network request -->
  <link rel="icon" href="data:," />

  <!--
  ==============================================================================
  EXHIBITION ROAD — PROJECT NOTES & README (Milestone 1)
  ==============================================================================

  HOW TO RUN
  1. Place this single `index.html` file in an empty folder.
  2. Serve it with a static HTTP server, for example:
       python -m http.server 8000
  3. Find your computer's local IP address and open
       http://<your-local-ip>:8000/
     on your phone connected to the same Wi-Fi network.
     (ES modules and import maps require HTTP/HTTPS, not file:// URLs.)

  HOW TO ADD A STATION (for M2+ / final build)
  1. Write a `buildStationX(parent)` function in Section 4 (SCENES) that adds
     3D meshes to `parent` (centered near origin, +Y up, front facing +Z,
     footprint radius <= 5.5, resting on y = 0) and optionally returns
     `{ update(time, dt) }`.
  2. Add an entry `{ id, title, description, build }` to the `SECTIONS` array
     in Section 5. Road length, station placement along the planet, HUD dots,
     and accessible page text update automatically.

  MAIN TUNABLE CONSTANTS (see Section 1: CONFIG)
  - PLANET_RADIUS      Radius of the world sphere (150)
  - FIRST_STATION      Distance along road to station 1 (60)
  - STATION_SPACING    Distance between stations (90)
  - ROAD_END_OFFSET    Extra road distance after the last station (40)
  - FOG_NEAR / FOG_FAR Soft fog fade range (25 to 90)
  - STATION_HIDE_DIST  Cull stations farther than this from camera (80)
  - MAX_SPEED          Top walking speed in world units/sec (8)
  - SPEED_EASE_RATE    Exponential acceleration/deceleration rate (5)
  - LOOK_SENSITIVITY   Camera rotation radians per dragged pixel (0.005)
  - INVERT_LOOK        Flip drag-to-look direction (false)
  - ENABLE_SHADOWS     Toggle directional sunlight shadow map (true)
  - PALETTE            Shared low-poly color scheme

  DECISIONS (M1)
  - Sphere orientation: The ground sphere's poles are rotated onto the X axis
    (left/right of the road) instead of Y. That puts uniform quad facets along
    the road equator rather than a 64-triangle pole pinch right at progress = 0.
  - Road & crate grounding: Because a 64x32 flat-shaded sphere curves slightly
    between vertices, the road slab, verges, and M1 placeholder crates extend
    ~0.4-0.6 units below the nominal radius so edges never visibly float.
  - Road ends: The road strip extends 5 units past progress = 0 (behind) and
    5 units past ROAD_END (ahead) so looking straight down at either stop limit
    still shows solid road beneath your feet.
  - M1 placeholders: Each station currently spawns a simple two-part wooden
    crate at SCENE_LAYOUT (top height ~3.3 units) so horizon occlusion can be
    tested before signs (M2) and dioramas (M3/M4) are added.
  ==============================================================================
  -->

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      overscroll-behavior: none;
      background-color: #bfe3f0;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    /* Top-center progress dots (non-interactive) */
    .hud-dots {
      position: fixed;
      top: max(18px, calc(12px + env(safe-area-inset-top)));
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 14px;
      border-radius: 999px;
      background: rgba(34, 42, 48, 0.22);
      pointer-events: none;
      z-index: 10;
    }

    .hud-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.48);
      transition: background-color 0.3s ease, transform 0.3s ease, box-shadow 0.3s ease;
    }

    .hud-dot.is-active {
      background: #f2a541;
      transform: scale(1.3);
      box-shadow: 0 0 8px rgba(242, 165, 65, 0.75);
    }

    /* First-use hint (non-interactive, fades out on first movement) */
    .hud-hint {
      position: fixed;
      top: max(58px, calc(52px + env(safe-area-inset-top)));
      left: 50%;
      transform: translateX(-50%);
      max-width: min(300px, calc(100vw - 32px));
      padding: 8px 14px;
      border-radius: 12px;
      background: rgba(34, 42, 48, 0.45);
      color: #ffffff;
      font-size: 13px;
      line-height: 1.35;
      text-align: center;
      pointer-events: none;
      z-index: 10;
      opacity: 1;
      transition: opacity 0.6s ease;
    }

    .hud-hint.is-hidden {
      opacity: 0;
    }

    /* Bottom-right stacked movement buttons */
    .controls {
      position: fixed;
      right: max(18px, calc(12px + env(safe-area-inset-right)));
      bottom: max(22px, calc(16px + env(safe-area-inset-bottom)));
      display: flex;
      flex-direction: column;
      gap: 14px;
      z-index: 20;
    }

    .move-btn {
      width: 76px;
      height: 76px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.75);
      background: rgba(34, 42, 48, 0.42);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      margin: 0;
      cursor: pointer;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      transition: transform 0.1s ease, background-color 0.12s ease;
    }

    .move-btn.is-pressed {
      background: rgba(34, 42, 48, 0.75);
      transform: scale(0.93);
    }

    .move-btn svg {
      width: 28px;
      height: 28px;
      pointer-events: none;
      display: block;
    }

    /* Visually hidden text mirror for screen readers & search engines */
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js"
      }
    }
  </script>
</head>
<body>
  <!-- HUD overlays -->
  <div class="hud-dots" id="hud-dots" aria-hidden="true"></div>
  <div class="hud-hint" id="hud-hint" aria-hidden="true">
    Hold the arrows to move. Drag to look around.
  </div>

  <!-- On-screen movement buttons (forward on top, backward below) -->
  <div class="controls" id="controls">
    <button
      type="button"
      class="move-btn"
      id="btn-forward"
      aria-label="Walk forward along the road"
    >
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="18 15 12 9 6 15"></polyline>
      </svg>
    </button>
    <button
      type="button"
      class="move-btn"
      id="btn-backward"
      aria-label="Walk backward along the road"
    >
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="6 9 12 15 18 9"></polyline>
      </svg>
    </button>
  </div>

  <!-- Visually hidden HTML copy generated from SECTIONS -->
  <main class="sr-only" id="sr-content"></main>

  <script type="module">
    import * as THREE from 'three';

    // ===== 1. CONFIG =====
    const CONFIG = {
      // Planet & road dimensions
      PLANET_RADIUS: 150,
      FIRST_STATION: 60,
      STATION_SPACING: 90,
      ROAD_END_OFFSET: 40,
      ROAD_WIDTH: 4.0,
      VERGE_WIDTH: 5.2,
      DASH_LENGTH: 2.2,
      DASH_WIDTH: 0.16,
      DASH_STEP: 5.0,
      STATION_HIDE_DIST: 80,

      // Camera & atmosphere
      CAMERA_HEIGHT: 1.7,
      CAMERA_FOV: 70,
      CAMERA_NEAR: 0.05,
      CAMERA_FAR: 300,
      FOG_NEAR: 25,
      FOG_FAR: 90,

      // Movement & look controls
      MAX_SPEED: 8,
      SPEED_EASE_RATE: 5,
      MAX_DT: 0.05,
      LOOK_SENSITIVITY: 0.005,
      MAX_PITCH_DEG: 89,
      INVERT_LOOK: false,

      // Lighting & rendering
      ENABLE_SHADOWS: true,
      SHADOW_FRUSTUM: 22,
      SHADOW_MAP_SIZE: 1024,
      MAX_PIXEL_RATIO: 2,

      // Shared low-poly palette
      PALETTE: {
        sky: 0xbfe3f0,
        grass: 0x7bbf6a,
        road: 0x4a4d52,
        verge: 0x62676e,
        line: 0xf2e9c9,
        wood: 0x8a5a3b,
        cream: 0xf3e9d2,
        brick: 0xb5533c,
        roof: 0x7a3b2e,
        red: 0xd64541,
        blue: 0x3f78c4,
        accent: 0xf2a541,
        crate: 0xc28e5c,
      },
    };

    const SIGN_LAYOUT = {
      x: -4.5,
      z: -2,
      rotationY: 0.45,
      boardWidth: 5,
      boardHeight: 3.75,
    };

    const SCENE_LAYOUT = {
      x: 7.0,
      z: -2,
      rotationY: -0.45,
    };


    // ===== 2. PRIMITIVES =====
    // Material cache + minimal addBox helper for M1 placeholders (full set in M3)
    const materialCache = new Map();

    function getFlatMaterial(color) {
      if (!materialCache.has(color)) {
        materialCache.set(
          color,
          new THREE.MeshStandardMaterial({
            color,
            flatShading: true,
            roughness: 0.9,
            metalness: 0.0,
          })
        );
      }
      return materialCache.get(color);
    }

    function addBox(parent, size, position, color) {
      const geo = new THREE.BoxGeometry(size[0], size[1], size[2]);
      const mesh = new THREE.Mesh(geo, getFlatMaterial(color));
      mesh.position.set(position[0], position[1], position[2]);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      parent.add(mesh);
      return mesh;
    }


    // ===== 3. SIGNS =====
    // (Scheduled for Milestone 2)


    // ===== 4. SCENES =====
    // M1 placeholder diorama: a simple two-part wooden crate resting on y = 0
    // (skirt dips slightly into y < 0 so it meets the curved planet cleanly)
    function buildPlaceholderCrate(parent) {
      // Main crate body (extends from y = -0.45 up to y = 3.15)
      addBox(parent, [3.8, 3.6, 3.8], [0, 1.35, 0], CONFIG.PALETTE.crate);
      // Darker lid rim so rotation / orientation is easy to judge visually
      addBox(parent, [4.0, 0.35, 4.0], [0, 3.12, 0], CONFIG.PALETTE.wood);
    }


    // ===== 5. SECTIONS =====
    const SECTIONS = [
      {
        id: 'time-together',
        title: 'More time with the people you love.',
        description:
          "Pay ... $ a year and be ready for the day your career ends. Spend it where it matters: at home, with the people you love. That's what our retirement insurance is for.",
        build: buildPlaceholderCrate,
      },
      {
        id: 'peace-of-mind',
        title: "Let the storm pass. You're covered.",
        description:
          'Life insurance that keeps your family protected, whatever tomorrow brings. For ... $ a month, the people you love never have to worry about the bills.',
        build: buildPlaceholderCrate,
      },
      {
        id: 'freedom',
        title: 'Retire into your next adventure.',
        description:
          "The road doesn't end when the career does. Plan ahead with ... $ a year and be free to go wherever you've always wanted. No schedule, no worries.",
        build: buildPlaceholderCrate,
      },
    ];

    const LAST_STATION_S =
      CONFIG.FIRST_STATION + (SECTIONS.length - 1) * CONFIG.STATION_SPACING;
    const MAX_PROGRESS = LAST_STATION_S + CONFIG.ROAD_END_OFFSET;


    // ===== 6. WORLD =====
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, CONFIG.MAX_PIXEL_RATIO));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;
    renderer.shadowMap.enabled = CONFIG.ENABLE_SHADOWS;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.insertBefore(renderer.domElement, document.body.firstChild);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(CONFIG.PALETTE.sky);
    scene.fog = new THREE.Fog(CONFIG.PALETTE.sky, CONFIG.FOG_NEAR, CONFIG.FOG_FAR);

    // Fixed first-person camera at (0, 1.7, 0) looking down -Z by default
    const camera = new THREE.PerspectiveCamera(
      CONFIG.CAMERA_FOV,
      window.innerWidth / window.innerHeight,
      CONFIG.CAMERA_NEAR,
      CONFIG.CAMERA_FAR
    );
    camera.position.set(0, CONFIG.CAMERA_HEIGHT, 0);
    camera.rotation.order = 'YXZ';

    // World-space lighting: one hemisphere light + one shadow-casting sun light
    const hemiLight = new THREE.HemisphereLight(0xeef8fc, 0x6b9e5c, 0.95);
    scene.add(hemiLight);

    const sunLight = new THREE.DirectionalLight(0xfff5e4, 1.35);
    sunLight.position.set(14, 28, 20);
    sunLight.target.position.set(0, 0, -4);
    scene.add(sunLight);
    scene.add(sunLight.target);

    if (CONFIG.ENABLE_SHADOWS) {
      sunLight.castShadow = true;
      const f = CONFIG.SHADOW_FRUSTUM;
      sunLight.shadow.camera.left = -f;
      sunLight.shadow.camera.right = f;
      sunLight.shadow.camera.top = f;
      sunLight.shadow.camera.bottom = -f;
      sunLight.shadow.camera.near = 2;
      sunLight.shadow.camera.far = 75;
      sunLight.shadow.mapSize.set(CONFIG.SHADOW_MAP_SIZE, CONFIG.SHADOW_MAP_SIZE);
      sunLight.shadow.bias = -0.0005;
      sunLight.shadow.normalBias = 0.02;
    }

    // Tiny planet group centered below the camera's feet
    const planet = new THREE.Group();
    planet.position.set(0, -CONFIG.PLANET_RADIUS, 0);
    scene.add(planet);

    // Ground sphere (64 x 32 flat-shaded). Poles rotated to +/-X so the road
    // follows the uniform equator rather than converging at a pole vertex.
    const groundGeo = new THREE.SphereGeometry(CONFIG.PLANET_RADIUS, 64, 32);
    groundGeo.rotateZ(Math.PI / 2);
    const groundMesh = new THREE.Mesh(groundGeo, getFlatMaterial(CONFIG.PALETTE.grass));
    groundMesh.receiveShadow = true;
    planet.add(groundMesh);

    // Build a curved rectangular band along the planet's YZ great circle
    function createRoadArcGeometry(rTop, rBottom, width, sStart, sEnd, segLength) {
      const steps = Math.max(2, Math.ceil((sEnd - sStart) / segLength));
      const halfW = width * 0.5;
      const positions = [];
      const indices = [];

      for (let i = 0; i <= steps; i++) {
        const s = sStart + (i / steps) * (sEnd - sStart);
        const theta = s / CONFIG.PLANET_RADIUS;
        const c = Math.cos(theta);
        const sn = Math.sin(theta);

        // 4 vertices per ring: left-bottom, left-top, right-top, right-bottom
        positions.push(
          -halfW, rBottom * c, -rBottom * sn,
          -halfW, rTop * c, -rTop * sn,
           halfW, rTop * c, -rTop * sn,
           halfW, rBottom * c, -rBottom * sn
        );
      }

      for (let i = 0; i < steps; i++) {
        const a = i * 4;
        const b = (i + 1) * 4;
        // Left side skirt
        indices.push(a + 0, b + 0, b + 1, a + 0, b + 1, a + 1);
        // Top surface
        indices.push(a + 1, b + 1, b + 2, a + 1, b + 2, a + 2);
        // Right side skirt
        indices.push(a + 2, b + 2, b + 3, a + 2, b + 3, a + 3);
      }

      // Start & end caps
      const last = steps * 4;
      indices.push(0, 1, 2, 0, 2, 3);
      indices.push(last + 0, last + 2, last + 1, last + 0, last + 3, last + 2);

      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      geo.setIndex(indices);
      geo.computeVertexNormals();
      return geo;
    }

    const roadStartS = -5;
    const roadEndS = MAX_PROGRESS + 5;

    // Lighter verges slightly wider and lower than the main road surface
    const vergeMesh = new THREE.Mesh(
      createRoadArcGeometry(
        CONFIG.PLANET_RADIUS + 0.04,
        CONFIG.PLANET_RADIUS - 0.5,
        CONFIG.VERGE_WIDTH,
        roadStartS,
        roadEndS,
        2.0
      ),
      getFlatMaterial(CONFIG.PALETTE.verge)
    );
    vergeMesh.receiveShadow = true;
    planet.add(vergeMesh);

    // Main dark road surface
    const roadMesh = new THREE.Mesh(
      createRoadArcGeometry(
        CONFIG.PLANET_RADIUS + 0.08,
        CONFIG.PLANET_RADIUS - 0.5,
        CONFIG.ROAD_WIDTH,
        roadStartS,
        roadEndS,
        2.0
      ),
      getFlatMaterial(CONFIG.PALETTE.road)
    );
    roadMesh.receiveShadow = true;
    planet.add(roadMesh);

    // Dashed center line as a single InstancedMesh along the great circle
    const dashCount = Math.floor(MAX_PROGRESS / CONFIG.DASH_STEP) + 1;
    const dashGeo = new THREE.BoxGeometry(CONFIG.DASH_WIDTH, 0.03, CONFIG.DASH_LENGTH);
    const dashMesh = new THREE.InstancedMesh(
      dashGeo,
      getFlatMaterial(CONFIG.PALETTE.line),
      dashCount
    );
    dashMesh.receiveShadow = true;

    const dashDummy = new THREE.Object3D();
    const dashRadius = CONFIG.PLANET_RADIUS + 0.095;
    for (let i = 0; i < dashCount; i++) {
      const s = i * CONFIG.DASH_STEP + CONFIG.DASH_LENGTH * 0.5;
      const theta = s / CONFIG.PLANET_RADIUS;
      dashDummy.position.set(0, dashRadius * Math.cos(theta), -dashRadius * Math.sin(theta));
      dashDummy.rotation.set(-theta, 0, 0);
      dashDummy.updateMatrix();
      dashMesh.setMatrixAt(i, dashDummy.matrix);
    }
    dashMesh.instanceMatrix.needsUpdate = true;
    planet.add(dashMesh);

    // Place stations along the planet
    const stations = SECTIONS.map((section, index) => {
      const s = CONFIG.FIRST_STATION + index * CONFIG.STATION_SPACING;

      const pivot = new THREE.Group();
      pivot.rotation.x = -s / CONFIG.PLANET_RADIUS;
      planet.add(pivot);

      const stationGroup = new THREE.Group();
      stationGroup.position.set(0, CONFIG.PLANET_RADIUS, 0);
      pivot.add(stationGroup);

      // Diorama container positioned on the right side of the road
      const sceneGroup = new THREE.Group();
      sceneGroup.position.set(SCENE_LAYOUT.x, 0, SCENE_LAYOUT.z);
      sceneGroup.rotation.y = SCENE_LAYOUT.rotationY;
      stationGroup.add(sceneGroup);

      const controller = section.build(sceneGroup) || null;

      return {
        id: section.id,
        s,
        pivot,
        group: stationGroup,
        controller,
      };
    });


    // ===== 7. CONTROLS =====
    let progress = 0;
    let speed = 0;
    let yaw = 0;
    let pitch = 0;
    const MAX_PITCH_RAD = THREE.MathUtils.degToRad(CONFIG.MAX_PITCH_DEG);

    const canvas = renderer.domElement;
    const btnForward = document.getElementById('btn-forward');
    const btnBackward = document.getElementById('btn-backward');

    // Track held buttons by pointerId so simultaneous thumb holds work cleanly
    const forwardPointers = new Set();
    const backwardPointers = new Set();
    let dragPointerId = null;
    let lastDragX = 0;
    let lastDragY = 0;

    function updateButtonVisuals() {
      btnForward.classList.toggle('is-pressed', forwardPointers.size > 0);
      btnBackward.classList.toggle('is-pressed', backwardPointers.size > 0);
    }

    function bindHoldButton(button, pointerSet) {
      button.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        e.stopPropagation();
        pointerSet.add(e.pointerId);
        try {
          button.setPointerCapture(e.pointerId);
        } catch (_) {
          // Ignore if synthetic/unsupported pointer
        }
        updateButtonVisuals();
      });

      const release = (e) => {
        if (!pointerSet.has(e.pointerId)) return;
        pointerSet.delete(e.pointerId);
        updateButtonVisuals();
      };

      button.addEventListener('pointerup', release);
      button.addEventListener('pointercancel', release);
      button.addEventListener('lostpointercapture', release);
    }

    bindHoldButton(btnForward, forwardPointers);
    bindHoldButton(btnBackward, backwardPointers);

    // Drag-to-look anywhere on the canvas (ignores drags starting on buttons)
    canvas.addEventListener('pointerdown', (e) => {
      if (e.target !== canvas) return;
      if (dragPointerId !== null) return;
      dragPointerId = e.pointerId;
      lastDragX = e.clientX;
      lastDragY = e.clientY;
      try {
        canvas.setPointerCapture(e.pointerId);
      } catch (_) {
        // Ignore if synthetic/unsupported pointer
      }
    });

    canvas.addEventListener('pointermove', (e) => {
      if (e.pointerId !== dragPointerId) return;
      const dx = e.clientX - lastDragX;
      const dy = e.clientY - lastDragY;
      lastDragX = e.clientX;
      lastDragY = e.clientY;

      const invert = CONFIG.INVERT_LOOK ? -1 : 1;
      // Grab-the-world feel: dragging right pans view left (+yaw),
      // dragging down tilts view up (+pitch).
      yaw += dx * CONFIG.LOOK_SENSITIVITY * invert;
      pitch += dy * CONFIG.LOOK_SENSITIVITY * invert;
      pitch = THREE.MathUtils.clamp(pitch, -MAX_PITCH_RAD, MAX_PITCH_RAD);

      // Keep yaw wrapped to [-PI, PI]
      if (yaw > Math.PI) yaw -= Math.PI * 2;
      if (yaw < -Math.PI) yaw += Math.PI * 2;
    });

    const endDrag = (e) => {
      if (e.pointerId === dragPointerId) {
        dragPointerId = null;
      }
    };
    canvas.addEventListener('pointerup', endDrag);
    canvas.addEventListener('pointercancel', endDrag);
    canvas.addEventListener('lostpointercapture', endDrag);

    // Prevent long-press context menu and clear held inputs if tab loses focus
    window.addEventListener('contextmenu', (e) => e.preventDefault());
    window.addEventListener('blur', () => {
      forwardPointers.clear();
      backwardPointers.clear();
      dragPointerId = null;
      updateButtonVisuals();
    });


    // ===== 8. HUD =====
    const hudDotsEl = document.getElementById('hud-dots');
    const hudHintEl = document.getElementById('hud-hint');
    const srContentEl = document.getElementById('sr-content');

    // Build one progress dot per station
    const dots = SECTIONS.map(() => {
      const dot = document.createElement('span');
      dot.className = 'hud-dot';
      hudDotsEl.appendChild(dot);
      return dot;
    });

    // Generate visually hidden HTML copy from SECTIONS
    SECTIONS.forEach((section) => {
      const article = document.createElement('article');
      const h2 = document.createElement('h2');
      h2.textContent = section.title;
      const p = document.createElement('p');
      p.textContent = section.description;
      article.appendChild(h2);
      article.appendChild(p);
      srContentEl.appendChild(article);
    });

    let hintDismissed = false;
    const DOT_ACTIVE_RANGE = CONFIG.STATION_SPACING / 3;

    function updateHUD() {
      if (!hintDismissed && progress > 0.1) {
        hintDismissed = true;
        hudHintEl.classList.add('is-hidden');
      }

      // Light only the dot of the nearest station when within 1/3 spacing
      let nearestIndex = -1;
      let nearestDist = Infinity;
      for (let i = 0; i < stations.length; i++) {
        const d = Math.abs(progress - stations[i].s);
        if (d < nearestDist) {
          nearestDist = d;
          nearestIndex = i;
        }
      }

      for (let i = 0; i < dots.length; i++) {
        dots[i].classList.toggle(
          'is-active',
          i === nearestIndex && nearestDist <= DOT_ACTIVE_RANGE
        );
      }
    }


    // ===== 9. MAIN LOOP =====
    function onResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, CONFIG.MAX_PIXEL_RATIO));
      renderer.setSize(window.innerWidth, window.innerHeight);
    }
    window.addEventListener('resize', onResize);

    let lastTime = 0;

    function animate(now) {
      requestAnimationFrame(animate);

      if (lastTime === 0) lastTime = now;
      const dt = Math.min((now - lastTime) / 1000, CONFIG.MAX_DT);
      lastTime = now;
      const elapsed = now * 0.001;

      // Determine movement target from held buttons
      const goForward = forwardPointers.size > 0;
      const goBackward = backwardPointers.size > 0;
      let targetSpeed = 0;
      if (goForward && !goBackward) targetSpeed = CONFIG.MAX_SPEED;
      else if (goBackward && !goForward) targetSpeed = -CONFIG.MAX_SPEED;

      // Smooth speed exponentially and advance progress along the road
      const ease = 1 - Math.exp(-CONFIG.SPEED_EASE_RATE * dt);
      speed += (targetSpeed - speed) * ease;
      if (targetSpeed === 0 && Math.abs(speed) < 0.0005) {
        speed = 0;
      }

      progress += speed * dt;
      if (progress <= 0) {
        progress = 0;
        if (speed < 0) speed = 0;
      } else if (progress >= MAX_PROGRESS) {
        progress = MAX_PROGRESS;
        if (speed > 0) speed = 0;
      }

      // Rotate the tiny planet and update camera look angles
      planet.rotation.x = progress / CONFIG.PLANET_RADIUS;
      camera.rotation.y = yaw;
      camera.rotation.x = pitch;

      // Cull distant stations and update only visible ones
      for (let i = 0; i < stations.length; i++) {
        const st = stations[i];
        const visible = Math.abs(progress - st.s) <= CONFIG.STATION_HIDE_DIST;
        st.pivot.visible = visible;
        if (visible && st.controller && st.controller.update) {
          st.controller.update(elapsed, dt);
        }
      }

      updateHUD();
      renderer.render(scene, camera);
    }

    requestAnimationFrame(animate);
  </script>
</body>
